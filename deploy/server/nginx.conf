worker_processes 2;
pid /tmp/nginx.pid;
error_log /dev/stderr warn;
events { worker_connections 1024; }
http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;
    # Do not log query strings: they can contain publication or S3 signatures.
    log_format dtwin '$remote_addr [$time_local] "$request_method $uri $server_protocol" '
                     '$status $body_bytes_sent $request_time';
    access_log /dev/stdout dtwin;
    server_tokens off;
    sendfile on;
    keepalive_timeout 65;
    client_max_body_size 100m;
    client_body_temp_path /tmp/client_body;
    proxy_temp_path /tmp/proxy;
    map $http_upgrade $connection_upgrade {
        default upgrade;
        '' close;
    }
    server {
        listen 19080;
        server_name _;
        root /usr/share/nginx/html;
        index index.html;
        add_header X-Content-Type-Options nosniff always;

        location = /health {
            proxy_pass http://127.0.0.1:21080;
            proxy_set_header Host $http_host;
        }
        location ^~ /api/ {
            proxy_pass http://127.0.0.1:21080;
            proxy_http_version 1.1;
            proxy_set_header Host $http_host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $remote_addr;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection $connection_upgrade;
            proxy_read_timeout 3600s;
            proxy_send_timeout 120s;
            proxy_buffering off;
        }
        # Bucket name and signed Host, path, query and Range must stay unchanged.
        location ^~ /factory-twin/ {
            proxy_pass http://127.0.0.1:18333;
            proxy_http_version 1.1;
            proxy_set_header Host $http_host;
            proxy_set_header Connection "";
            proxy_request_buffering off;
            proxy_buffering off;
            proxy_read_timeout 120s;
        }
        location / {
            try_files $uri $uri/ =404;
        }
        location = /index.html {
            add_header Cache-Control "no-cache";
        }
    }
}
