name: factory-twin
x-app: &app
  image: factory-twin-backend:0.1.0
  build: ../../apps/backend
  restart: unless-stopped
  env_file: .env
  environment: &env
    DATABASE_URL: jdbc:postgresql://postgres:5432/factory_twin
    VALKEY_HOST: valkey
    VALKEY_PORT: 6379
    S3_ENDPOINT: http://storage:8333
  depends_on:
    postgres: {condition: service_healthy}
    valkey: {condition: service_healthy}
    storage: {condition: service_started}
  mem_limit: 768m
  read_only: true
  tmpfs: ['/tmp:size=256m,mode=1777']
  security_opt: [no-new-privileges:true]
  logging: {driver: json-file, options: {max-size: 10m, max-file: '3'}}
services:
  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: factory_twin
      POSTGRES_USER: twin
      POSTGRES_PASSWORD: ${DATABASE_PASSWORD:?Run init-local.mjs}
    ports: ['127.0.0.1:15432:5432']
    volumes: [postgres-data:/var/lib/postgresql/data]
    healthcheck:
      test: [CMD-SHELL, 'pg_isready -U twin -d factory_twin']
      interval: 5s
      timeout: 3s
      retries: 20
  valkey:
    image: valkey/valkey:8.1.3-alpine
    restart: unless-stopped
    environment: {VALKEY_PASSWORD: '${VALKEY_PASSWORD:?Run init-local.mjs}'}
    command: [sh, -c, 'exec valkey-server --requirepass "$$VALKEY_PASSWORD" --appendonly yes --maxmemory 128mb --maxmemory-policy noeviction']
    ports: ['127.0.0.1:16379:6379']
    volumes: [valkey-data:/data]
    healthcheck:
      test: [CMD-SHELL, 'REDISCLI_AUTH="$$VALKEY_PASSWORD" valkey-cli ping | grep -q PONG']
      interval: 5s
      timeout: 3s
      retries: 20
  storage:
    image: chrislusf/seaweedfs:4.47
    restart: unless-stopped
    command: [mini, '-dir=/data', '-ip=storage', '-ip.bind=0.0.0.0', '-bucket=factory-twin']
    environment:
      AWS_ACCESS_KEY_ID: ${S3_ACCESS_KEY:?Run init-local.mjs}
      AWS_SECRET_ACCESS_KEY: ${S3_SECRET_KEY:?Run init-local.mjs}
    ports: ['127.0.0.1:18333:8333']
    volumes: [object-data:/data]
  api:
    <<: *app
    ports: ['127.0.0.1:18080:8080']
    environment: {<<: *env, TWIN_MODE: api}
  collector:
    <<: *app
    environment: {<<: *env, TWIN_MODE: collector, DB_POOL_SIZE: 4}
    mem_limit: 512m
  worker:
    <<: *app
    environment: {<<: *env, TWIN_MODE: worker, DB_POOL_SIZE: 4}
    mem_limit: 512m
volumes:
  postgres-data:
  valkey-data:
  object-data:
